# Made by the deploy plugin from `deploy Grid` in deploy.piper, when the program was built: change that,
# not this. Set the image to yours, then:  kubectl apply -f grid.yaml
apiVersion: v1
kind: Service
metadata:
  name: grid
  labels:
    app: grid
    role: coordinator
spec:
  type: LoadBalancer
  selector:
    app: grid
    role: coordinator
  ports:
    - name: http
      port: 8090
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: grid-coordinator
  labels:
    app: grid
    role: coordinator
spec:
  selector:
    app: grid
    role: coordinator
  ports:
    - name: actors
      port: 8000
      targetPort: actors
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grid-coordinator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grid
      role: coordinator
  template:
    metadata:
      labels:
        app: grid
        role: coordinator
    spec:
      containers:
        - name: coordinator
          image: REGISTRY/grid:1
          args:
            - coordinator
            - --host
            - grid-coordinator
            - --port
            - "8000"
            - --http
            - "8090"
          ports:
            - name: actors
              containerPort: 8000
            - name: http
              containerPort: 8090
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              memory: "256Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grid-worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: grid
      role: worker
  template:
    metadata:
      labels:
        app: grid
        role: worker
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: worker
          image: REGISTRY/grid:1
          args:
            - worker
            - --host
            - $(POD_IP)
            - --port
            - "8000"
            - --coordinator
            - grid-coordinator:8000
            - --name
            - $(POD_NAME)
            - --workers
            - "1"
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: actors
              containerPort: 8000
          resources:
            requests:
              cpu: "500m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "256Mi"
