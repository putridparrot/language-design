# Three stock nodes in Docker, each reaching the others by its service name, as pods do by theirs in Kubernetes:
#
#   docker compose -f apps/stock/docker-compose.yml up --build
#
# Their HTTP APIs are on localhost:8081, 8082 and 8083. Then, from the piper folder:
#
#   piper run apps/stock -- load http://localhost:8081 http://localhost:8082 http://localhost:8083

x-node: &node
  build:
    context: ../..
    dockerfile: apps/stock/Dockerfile
  image: stock:local

services:
  stock-0:
    <<: *node
    command: ["--host", "stock-0", "--nodes", "stock-0:8000,stock-1:8000,stock-2:8000", "--events", "/data/events.db"]
    volumes: ["stock-0-data:/data"]
    ports: ["8081:8080"]
  stock-1:
    <<: *node
    command: ["--host", "stock-1", "--nodes", "stock-0:8000,stock-1:8000,stock-2:8000", "--events", "/data/events.db"]
    volumes: ["stock-1-data:/data"]
    ports: ["8082:8080"]
  stock-2:
    <<: *node
    command: ["--host", "stock-2", "--nodes", "stock-0:8000,stock-1:8000,stock-2:8000", "--events", "/data/events.db"]
    volumes: ["stock-2-data:/data"]
    ports: ["8083:8080"]

# Each node's products' events, kept across restarts (docker compose down -v removes them).
volumes:
  stock-0-data:
  stock-1-data:
  stock-2-data:
