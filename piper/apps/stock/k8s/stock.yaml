# The stock app on Kubernetes (AKS, or any other cluster): three pods in a StatefulSet, so each has a stable name
# (stock-0, stock-1, stock-2), which the headless service stock-nodes turns into a DNS name (stock-0.stock-nodes) the
# nodes reach each other by. A LoadBalancer service puts their HTTP APIs behind one address. Each pod keeps its
# products' events in a SQLite file on a volume of its own, so a restarted pod carries on with their counts.
#
# Set the image to yours (see README.md), then:  kubectl apply -f apps/stock/k8s/stock.yaml
#
# To change the number of nodes, change `replicas` and the --nodes list together: every node must list them all, in
# the same order.

apiVersion: v1
kind: Service
metadata:
  name: stock-nodes
  labels:
    app: stock
spec:
  clusterIP: None                  # headless: a DNS name per pod, rather than one address for them all
  publishNotReadyAddresses: true   # so the nodes can reach each other while they start
  selector:
    app: stock
  ports:
    - name: actors
      port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: stock
  labels:
    app: stock
spec:
  type: LoadBalancer
  selector:
    app: stock
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stock
spec:
  serviceName: stock-nodes
  replicas: 3
  podManagementPolicy: Parallel    # start them together: none waits for another
  selector:
    matchLabels:
      app: stock
  template:
    metadata:
      labels:
        app: stock
    spec:
      containers:
        - name: stock
          image: REGISTRY/stock:1
          args:
            - --host
            - $(POD_NAME).stock-nodes
            - --nodes
            - stock-0.stock-nodes:8000,stock-1.stock-nodes:8000,stock-2.stock-nodes:8000
          volumeMounts:
            - name: events             # this pod's own volume (below), so its products' counts outlive it
              mountPath: /data
          env:
            # Where its products' events are kept: a SQLite file on the pod's own volume. A database in your cloud
            # (sqlserver, postgres) is only a change of these, with Events__Connection from a Secret.
            - name: Events__Provider
              value: sqlite
            - name: Events__Connection
              value: Data Source=/data/events.db
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: actors
              containerPort: 8000
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
  # A volume for each pod, kept when the pod restarts or moves, and given back to the pod of the same name: stock-1's
  # products' events stay stock-1's. (Deleting the StatefulSet keeps them; delete the claims to clear the counts.)
  volumeClaimTemplates:
    - metadata:
        name: events
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
