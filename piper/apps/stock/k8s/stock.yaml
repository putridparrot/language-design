# Made by the deploy plugin from `deploy Stock` in deploy.piper, when the program was built: change that,
# not this. Set the image to yours, then:  kubectl apply -f stock.yaml
apiVersion: v1
kind: Secret
metadata:
  name: stock-db
type: Opaque
stringData:
  password: change-me
  connection: "Host=stock-db;Database=stock;Username=stock;Password=change-me"
---
apiVersion: v1
kind: Service
metadata:
  name: stock-db
spec:
  selector:
    app: stock-db
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stock-db
spec:
  serviceName: stock-db
  replicas: 1
  selector:
    matchLabels:
      app: stock-db
  template:
    metadata:
      labels:
        app: stock-db
    spec:
      containers:
        - name: postgres
          image: postgres:17
          env:
            - name: POSTGRES_DB
              value: stock
            - name: POSTGRES_USER
              value: stock
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stock-db
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: stock
  labels:
    app: stock
    role: stock
spec:
  type: LoadBalancer
  selector:
    app: stock
    role: stock
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock
spec:
  replicas: 3
  selector:
    matchLabels:
      app: stock
      role: stock
  template:
    metadata:
      labels:
        app: stock
        role: stock
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: stock
          image: REGISTRY/stock:1
          args:
            - --host
            - $(POD_IP)
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: Events__Provider
              value: postgres
            - name: Events__Connection
              valueFrom:
                secretKeyRef:
                  name: stock-db
                  key: connection
            - name: Cluster__Provider
              value: postgres
            - name: Cluster__Connection
              valueFrom:
                secretKeyRef:
                  name: stock-db
                  key: connection
          ports:
            - name: http
              containerPort: 8080
            - name: actors
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              memory: "256Mi"
