# The stock app on Kubernetes (AKS, or any other cluster): pods in a Deployment, which form a cluster: each product runs
# on one of them, its owner, and moves to another when a pod stops, fails or is added. They share one database
# (PostgreSQL, below) for two things: their products' events, so a product carries on from its events wherever it
# starts; and the cluster's members, each pod holding a lease there under its own IP, so they find each other with no
# list of nodes and no stable names. A LoadBalancer service puts their HTTP APIs behind one address.
#
# Set the image to yours (see README.md), then:  kubectl apply -f apps/stock/k8s/stock.yaml
#
# To change the number of nodes, change `replicas` (or kubectl scale deployment stock --replicas=5). For a managed
# database in your cloud (Azure Database for PostgreSQL, Amazon RDS, Cloud SQL), drop the stock-db parts and put its
# connection string in the stock-db Secret.

apiVersion: v1
kind: Secret
metadata:
  name: stock-db
type: Opaque
stringData:
  password: change-me
  connection: Host=stock-db;Database=stock;Username=stock;Password=change-me
---
apiVersion: v1
kind: Service
metadata:
  name: stock-db
spec:
  selector:
    app: stock-db
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stock-db
spec:
  serviceName: stock-db
  replicas: 1
  selector:
    matchLabels:
      app: stock-db
  template:
    metadata:
      labels:
        app: stock-db
    spec:
      containers:
        - name: postgres
          image: postgres:17
          env:
            - name: POSTGRES_DB
              value: stock
            - name: POSTGRES_USER
              value: stock
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stock-db
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  # The products' events, kept when the database's pod restarts or moves. (Delete the claim to clear the counts.)
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: stock
  labels:
    app: stock
spec:
  type: LoadBalancer
  selector:
    app: stock
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock
spec:
  replicas: 3
  selector:
    matchLabels:
      app: stock
  template:
    metadata:
      labels:
        app: stock
    spec:
      # Time to leave the cluster when stopped, handing its products to the others, before Kubernetes kills it.
      terminationGracePeriodSeconds: 30
      containers:
        - name: stock
          image: REGISTRY/stock:1
          args:
            - --host                   # how the other nodes reach this one: its pod's IP
            - $(POD_IP)
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # Where the products' events are kept: the database every node shares.
            - name: Events__Provider
              value: postgres
            - name: Events__Connection
              valueFrom:
                secretKeyRef:
                  name: stock-db
                  key: connection
            # How the nodes find each other: leases in that same database.
            - name: Cluster__Provider
              value: postgres
            - name: Cluster__Connection
              valueFrom:
                secretKeyRef:
                  name: stock-db
                  key: connection
          ports:
            - name: actors
              containerPort: 8000
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
